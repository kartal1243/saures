<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="340" height="84" fill="none">
  <defs>
    <linearGradient id="v3GoldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="v3Slate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="v3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- AMBLEM: Çember/Kalkan İçinde İkonik Dükkan & Tente Silueti -->
  <g transform="translate(6, 8)" filter="url(#v3Shadow)">
    <circle cx="34" cy="34" r="34" fill="url(#v3GoldShield)"/>
    <circle cx="34" cy="34" r="32.5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Dükkan Çatısı & Tente -->
    <path d="M19 28C19 26.5 20 25 22 25H46C48 25 49 26.5 49 28L47 34H21L19 28Z" fill="#FFFFFF"/>
    
    <!-- Tente Çizgileri -->
    <path d="M26 25L27 34M34 25V34M41 25L40 34" stroke="#F59E0B" stroke-width="2"/>

    <!-- Dükkan Binası -->
    <rect x="22" y="35" width="24" height="16" rx="2" fill="#FFFFFF"/>
    
    <!-- Kapı ve Vitrin -->
    <rect x="25" y="38" width="8" height="7" rx="1" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.8"/>
    <rect x="36" y="38" width="7" height="13" rx="1.5" fill="#1E293B"/>
  </g>

  <!-- LOGOTYPE: SADECE "Dükkânım YANIMDA" -->
  <g transform="translate(90, 16)">
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="32" font-weight="900" fill="url(#v3Slate)" letter-spacing="-0.7">Dükkânım</text>
    <text x="1" y="52" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="14.5" font-weight="900" fill="#D97706" letter-spacing="5">YANIMDA</text>
  </g>
</svg>
