<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="340" height="84" fill="none">
  <defs>
    <linearGradient id="v2StoreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="v2DarkSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="v2Elevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- AMBLEM: Minimalist Modern Geometrik Dükkan & Tente Çatısı (Çizgisel & Akıcı) -->
  <g transform="translate(6, 8)" filter="url(#v2Elevation)">
    <!-- Yuvarlatılmış Rozet -->
    <rect x="0" y="0" width="68" height="68" rx="20" fill="url(#v2StoreGold)"/>
    <rect x="1" y="1" width="66" height="66" rx="19" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Modern Çatı (Üçgen Tente) -->
    <path d="M16 32L34 18L52 32H16Z" fill="#FFFFFF"/>
    <!-- Çatı Altı Tente Saçağı -->
    <path d="M16 32H52V36C52 37.1 51.1 38 50 38H18C16.9 38 16 37.1 16 36V32Z" fill="#FEF3C7"/>

    <!-- Dükkan Duvarları & Vitrin -->
    <path d="M20 38V52C20 53.1 20.9 54 22 54H46C47.1 54 48 53.1 48 52V38H20Z" fill="#FFFFFF"/>
    
    <!-- İkili Geniş Vitrin Camı (Şık ve Ferah) -->
    <rect x="23" y="41" width="10" height="10" rx="2" fill="#F59E0B" opacity="0.35"/>
    <rect x="35" y="41" width="10" height="10" rx="2" fill="#1E293B"/>
  </g>

  <!-- LOGOTYPE: SADECE "Dükkânım YANIMDA" -->
  <g transform="translate(90, 16)">
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="32" font-weight="900" fill="url(#v2DarkSlate)" letter-spacing="-0.7">Dükkânım</text>
    <text x="1" y="52" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" font-size="14.5" font-weight="900" fill="#D97706" letter-spacing="5">YANIMDA</text>
  </g>
</svg>
