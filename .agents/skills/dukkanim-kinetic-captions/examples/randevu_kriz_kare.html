<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Dükkanım Yanımda — Randevu Krizi (Kinetik Yazı Demo)</title>
<script src="../../dukkanim-video-producer/scripts/usta_vector_rig.js"></script>
<script src="../scripts/kinetic_captions.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #181C24; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(#3a2618 0%, #4a3020 58%, #6b4a2e 58%, #8a6038 100%); }
  /* wood slats */
  .slats { position:absolute; left:0; top:0; width:100%; height:1115px;
    background: repeating-linear-gradient(90deg, #5a3a22 0 70px, #4b2f1b 70px 74px, #644126 74px 140px, #4b2f1b 140px 144px); }
  .slats::after { content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at 70% 30%, rgba(255,170,90,.35), transparent 55%),
                linear-gradient(transparent 70%, rgba(0,0,0,.45)); }
  /* floor */
  .floor { position:absolute; left:0; top:1115px; width:100%; height:805px;
    background: linear-gradient(rgba(0,0,0,.35), transparent 30%),
      repeating-linear-gradient(90deg, transparent 0 134px, rgba(0,0,0,.18) 134px 138px),
      repeating-linear-gradient(0deg, #9b6c40 0 90px, #8a5e36 90px 94px); }
  /* door with glass */
  .door { position:absolute; left:40px; top:330px; width:440px; height:800px; background:#20252e;
    border:14px solid #2b313c; border-radius:10px 10px 0 0; box-shadow: inset 0 0 60px rgba(0,0,0,.5); }
  .door .glass { position:absolute; inset:24px; border-radius:6px;
    background: linear-gradient(160deg, rgba(190,225,255,.55), rgba(120,170,210,.25) 50%, rgba(255,190,120,.25)); }
  .door .glass::before { content:""; position:absolute; left:18%; top:0; width:14%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform:skewX(-14deg); }
  .awning { position:absolute; left:64px; top:350px; width:392px; height:56px;
    background: repeating-linear-gradient(90deg, #FF6B00 0 49px, #fff 49px 98px);
    clip-path: polygon(0 0,100% 0,100% 70%, 93.75% 100%, 87.5% 70%, 81.25% 100%, 75% 70%, 68.75% 100%, 62.5% 70%, 56.25% 100%, 50% 70%, 43.75% 100%, 37.5% 70%, 31.25% 100%, 25% 70%, 18.75% 100%, 12.5% 70%, 6.25% 100%, 0 70%); }
  .bell { position:absolute; left:440px; top:330px; width:40px; height:40px; border-radius:50% 50% 8px 8px;
    background: radial-gradient(circle at 35% 30%, #ffe28a, #d79a18); border:4px solid #181C24; }
  /* mirror with bulbs */
  .mirror { position:absolute; right:60px; top:250px; width:430px; height:640px; border-radius:215px 215px 30px 30px;
    background: linear-gradient(150deg, #9fb4c4, #5d7180 60%, #43525e); border:16px solid #181C24;
    box-shadow: 0 0 0 6px #FF6B00, 0 0 70px rgba(255,140,40,.55); }
  .mirror::after { content:""; position:absolute; left:16%; top:6%; width:18%; height:80%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); transform:skewX(-12deg); }
  .bulb { position:absolute; width:26px; height:26px; border-radius:50%; background:#fff6dc;
    box-shadow: 0 0 22px 8px rgba(255,214,140,.85); }
  /* clock */
  .clock { position:absolute; left:560px; top:110px; width:190px; height:190px; border-radius:50%; background:#fff;
    border:12px solid #FF6B00; box-shadow: 0 0 0 6px #181C24, 0 18px 40px rgba(0,0,0,.4); }
  .clock .h, .clock .m { position:absolute; left:50%; bottom:50%; background:#181C24; border-radius:6px; transform-origin: 50% 100%; }
  .clock .h { width:12px; height:46px; margin-left:-6px; transform: rotate(150deg); }
  .clock .m { width:8px; height:70px; margin-left:-4px; }
  .clock .dot { position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px; border-radius:50%; background:#FF6B00; border:4px solid #181C24; }
  .clock .t { position:absolute; width:6px; height:16px; left:50%; top:6px; margin-left:-3px; background:#181C24; transform-origin:50% 77px; }
  /* barber pole */
  .pole { position:absolute; left:500px; top:470px; width:44px; height:230px; border-radius:22px; border:6px solid #181C24;
    background: repeating-linear-gradient(-35deg, #FF6B00 0 22px, #fff 22px 44px); box-shadow: 0 0 30px rgba(255,107,0,.5); }
  /* warm spotlight + bokeh */
  .spot { position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 60% 40% at 72% 62%, rgba(255,190,110,.28), transparent 70%),
                radial-gradient(ellipse 50% 35% at 25% 60%, rgba(255,220,170,.18), transparent 70%); }
  .bokeh { position:absolute; border-radius:50%; background: rgba(255,200,130,.35); filter: blur(6px); }
  .vignette { position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55)); z-index:40; }
  .shadow { position:absolute; background: radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%); border-radius:50%; }
  #usta { position:absolute; left:450px; top:900px; width:640px; height:870px; z-index:20; }
  .cust { position:absolute; z-index:18; }
</style>
</head>
<body>

      <path d="M78,195 Q120,240 162,195" fill="none" stroke-width="4"/>

      <path d="M58,96 Q60,30 122,32 Q186,30 184,98 Q168,62 120,66 Q78,64 58,96 Z" fill="#3b2a1e"/>
      <circle cx="98" cy="112" r="7" fill="#181C24"/><circle cx="144" cy="112" r="7" fill="#181C24"/>

  <!-- CUSTOMER B: man 30s, navy jacket, glasses, holding phone -->
  <svg class="cust" style="left:300px;top:990px" width="288" height="771" viewBox="0 0 250 670">
    <g stroke="#181C24" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="82" y="400" width="40" height="220" rx="12" fill="#c8a97e"/>

      <path d="M200,225 Q236,170 214,100" fill="none" stroke-width="24" stroke="#1e2f5a"/>

      <circle cx="102" cy="118" r="18" fill="rgba(255,255,255,.3)"/><circle cx="150" cy="118" r="18" fill="rgba(255,255,255,.3)"/>

      <ellipse cx="60" cy="120" rx="10" ry="14" fill="#F4C29F"/><ellipse cx="190" cy="120" rx="10" ry="14" fill="#F4C29F"/>
    </g>
  </svg>

  <div id="usta"></div>
  <!-- BARBER CHAIR + SEATED CUSTOMER (shaving foam, black cape) -->

    <g stroke="#181C24" stroke-width="5" stroke-linejoin="round">

  <div class="vignette"></div></div>

<script>
  // clock ticks + bulbs + bokeh
  const clock = document.getElementById("clock");
  for (let i = 0; i < 12; i++) { const t = document.createElement("div"); t.className = "t"; t.style.transform = `rotate(${i*30}deg)`; clock.appendChild(t); }
  const root = document.getElementById("root");
  const mx = 1080 - 60 - 430, my = 250;
  [[0,.25],[0,.45],[0,.65],[0,.85],[1,.25],[1,.45],[1,.65],[1,.85]].forEach(([side, f]) => {
    const b = document.createElement("div"); b.className = "bulb";
    b.style.left = (side ? mx + 430 - 6 : mx - 20) + "px"; b.style.top = (my + 640 * f) + "px"; root.appendChild(b);
  });
  [[120,180,60],[900,140,40],[980,1000,70],[60,1050,50],[760,60,30]].forEach(([x,y,s]) => {
    const b = document.createElement("div"); b.className = "bokeh";
    Object.assign(b.style, { left:x+"px", top:y+"px", width:s+"px", height:s+"px" }); root.appendChild(b);
  });

  // Official Usta rig with customer in chair (static still)
  UstaVectorRig.create("#usta", { idPrefix: "usta", showCustomer: false, showChair: false });

  const K = KineticCaptions;
  // Dialogue — bubbles point at the speakers' mouths
  K.comicBubble(root, { x: 30, y: 700, w: 470, h: 220, name: "MÜŞTERİ 1",
    text: "Usta, benim randevum<br><em>saat 5'te!</em>", fontSize: 50, tailX: 190, tailY: 1150, tilt: -3 });
  K.comicBubble(root, { x: 470, y: 470, w: 560, h: 250, name: "MÜŞTERİ 2", shout: true,
    text: "Pardon ama<br>benimki de <em>5'te!</em>", fontSize: 56, tailX: 470, tailY: 1120, tilt: 3 });
  // Reaction effects on Usta + clock sticker
  K.burst(root, { x: 990, y: 1090, size: 150, text: "!?", fontSize: 90 });
  K.sticker(root, { x: 700, y: 330, text: "AYNI SAAT?!", tilt: 8, orange: true, fontSize: 40 });
</script>
</body>
</html>
