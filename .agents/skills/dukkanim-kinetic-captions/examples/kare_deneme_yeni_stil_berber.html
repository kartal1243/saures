<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Dükkanım Yanımda — Yeni Stil Berber Karesi (Sıfır Dikdörtgen Kutu & Organik Kinetik Balon)</title>
<script src="../../dukkanim-video-producer/scripts/usta_vector_rig.js"></script>
<script src="../scripts/kinetic_captions.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #181C24; }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(#3a2618 0%, #4a3020 58%, #6b4a2e 58%, #8a6038 100%);
  }
  /* wood slats */
  .slats {
    position: absolute; left: 0; top: 0; width: 100%; height: 1115px;
    background: repeating-linear-gradient(90deg, #5a3a22 0 70px, #4b2f1b 70px 74px, #644126 74px 140px, #4b2f1b 140px 144px);
  }
  .slats::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 70% 30%, rgba(255,170,90,.35), transparent 55%),
      linear-gradient(transparent 70%, rgba(0,0,0,.45));
  }
  /* floor */
  .floor {
    position: absolute; left: 0; top: 1115px; width: 100%; height: 805px;
    background:
      linear-gradient(rgba(0,0,0,.35), transparent 30%),
      repeating-linear-gradient(90deg, transparent 0 134px, rgba(0,0,0,.18) 134px 138px),
      repeating-linear-gradient(0deg, #9b6c40 0 90px, #8a5e36 90px 94px);
  }
  /* door with glass & orange-white awning */
  .door {
    position: absolute; left: 40px; top: 330px; width: 440px; height: 800px; background: #20252e;
    border: 14px solid #2b313c; border-radius: 10px 10px 0 0;
    box-shadow: inset 0 0 60px rgba(0,0,0,.5);
  }
  .door .glass {
    position: absolute; inset: 24px; border-radius: 6px;
    background: linear-gradient(160deg, rgba(190,225,255,.55), rgba(120,170,210,.25) 50%, rgba(255,190,120,.25));
  }
  .door .glass::before {
    content: ""; position: absolute; left: 18%; top: 0; width: 14%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-14deg);
  }
  .awning {
    position: absolute; left: 64px; top: 350px; width: 392px; height: 56px;
    background: repeating-linear-gradient(90deg, #FF6B00 0 49px, #fff 49px 98px);
    clip-path: polygon(0 0,100% 0,100% 70%, 93.75% 100%, 87.5% 70%, 81.25% 100%, 75% 70%, 68.75% 100%, 62.5% 70%, 56.25% 100%, 50% 70%, 43.75% 100%, 37.5% 70%, 31.25% 100%, 25% 70%, 18.75% 100%, 12.5% 70%, 6.25% 100%, 0 70%);
  }
  .bell {
    position: absolute; left: 440px; top: 330px; width: 40px; height: 40px;
    border-radius: 50% 50% 8px 8px;
    background: radial-gradient(circle at 35% 30%, #ffe28a, #d79a18);
    border: 4px solid #181C24;
  }
  /* arched mirror with glowing vanity bulbs */
  .mirror {
    position: absolute; right: 60px; top: 250px; width: 430px; height: 640px;
    border-radius: 215px 215px 30px 30px;
    background: linear-gradient(150deg, #9fb4c4, #5d7180 60%, #43525e);
    border: 16px solid #181C24;
    box-shadow: 0 0 0 6px #FF6B00, 0 0 70px rgba(255,140,40,.55);
  }
  .mirror::after {
    content: ""; position: absolute; left: 16%; top: 6%; width: 18%; height: 80%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
    transform: skewX(-12deg);
  }
  .bulb {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    background: #fff6dc;
    box-shadow: 0 0 22px 8px rgba(255,214,140,.85);
  }
  /* clock */
  .clock {
    position: absolute; left: 560px; top: 95px; width: 190px; height: 190px;
    border-radius: 50%; background: #fff;
    border: 12px solid #FF6B00;
    box-shadow: 0 0 0 6px #181C24, 0 18px 40px rgba(0,0,0,.4);
  }
  .clock .h, .clock .m {
    position: absolute; left: 50%; bottom: 50%; background: #181C24;
    border-radius: 6px; transform-origin: 50% 100%;
  }
  .clock .h { width: 12px; height: 46px; margin-left: -6px; transform: rotate(180deg); }
  .clock .m { width: 8px; height: 70px; margin-left: -4px; }
  .clock .dot {
    position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
    margin: -10px; border-radius: 50%; background: #FF6B00; border: 4px solid #181C24;
  }
  .clock .t {
    position: absolute; width: 6px; height: 16px; left: 50%; top: 6px;
    margin-left: -3px; background: #181C24; transform-origin: 50% 77px;
  }
  /* barber pole */
  .pole {
    position: absolute; left: 500px; top: 470px; width: 44px; height: 230px;
    border-radius: 22px; border: 6px solid #181C24;
    background: repeating-linear-gradient(-35deg, #FF6B00 0 22px, #fff 22px 44px);
    box-shadow: 0 0 30px rgba(255,107,0,.5);
  }
  /* warm spotlight + bokeh + vignette */
  .spot {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 72% 62%, rgba(255,190,110,.28), transparent 70%),
      radial-gradient(ellipse 50% 35% at 25% 60%, rgba(255,220,170,.18), transparent 70%);
  }
  .bokeh {
    position: absolute; border-radius: 50%;
    background: rgba(255,200,130,.35); filter: blur(6px);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55));
    z-index: 40;
  }
  .shadow {
    position: absolute;
    background: radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%);
    border-radius: 50%;
  }
  #usta {
    position: absolute; left: 455px; top: 870px; width: 640px; height: 910px; z-index: 20;
  }
  .cust { position: absolute; z-index: 18; }
</style>
</head>
<body>
<div id="root">
  <div class="slats"></div>
  <div class="floor"></div>
  <div class="door"><div class="glass"></div></div>
  <div class="awning"></div>
  <div class="bell"></div>
  <div class="pole"></div>
  <div class="mirror"></div>
  <div class="clock" id="clock"><div class="h"></div><div class="m"></div><div class="dot"></div></div>
  <div class="spot"></div>

  <div class="shadow" style="left:85px;top:1725px;width:300px;height:55px"></div>
  <div class="shadow" style="left:555px;top:1770px;width:470px;height:70px"></div>

  <!-- CUSTOMER ENTERING HAPPILY WITH CONFIRMED DÜKKANIM YANIMDA APPOINTMENT ON PHONE -->
  <svg class="cust" style="left:85px;top:980px" width="310" height="785" viewBox="0 0 250 670">
    <g stroke="#181C24" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="82" y="400" width="40" height="220" rx="12" fill="#c8a97e"/>
      <rect x="130" y="400" width="40" height="220" rx="12" fill="#c8a97e"/>
      <path d="M70,620 h58 v24 h-64 z" fill="#4a2e1c"/>
      <path d="M126,620 h58 v24 h-60 z" fill="#4a2e1c"/>
      <path d="M50,210 Q125,185 200,210 L208,420 Q125,436 42,420 Z" fill="#1e2f5a"/>
      <path d="M105,206 L125,300 L145,206 Z" fill="#fff"/>
      <path d="M50,225 Q20,310 44,400" fill="none" stroke-width="34" stroke="#181C24"/>
      <path d="M50,225 Q20,310 44,400" fill="none" stroke-width="24" stroke="#1e2f5a"/>
      <circle cx="46" cy="408" r="17" fill="#F4C29F"/>
      <!-- raised arm holding phone with Dükkanım Yanımda green checkmark -->
      <path d="M200,225 Q236,170 214,100" fill="none" stroke-width="34" stroke="#181C24"/>
      <path d="M200,225 Q236,170 214,100" fill="none" stroke-width="24" stroke="#1e2f5a"/>
      <g transform="translate(184,18) rotate(8)">
        <rect x="0" y="0" width="62" height="106" rx="14" fill="#181C24" stroke="#FF6B00" stroke-width="4"/>
        <rect x="6" y="10" width="50" height="86" rx="8" fill="#fff" stroke="none"/>
        <circle cx="31" cy="38" r="18" fill="#22C55E" stroke="none"/>
        <path d="M22,38 L29,45 L41,30" fill="none" stroke="#fff" stroke-width="5"/>
        <text x="31" y="80" font-family="Impact" font-size="21" text-anchor="middle" fill="#181C24" stroke="none">18:00</text>
      </g>
      <circle cx="214" cy="104" r="17" fill="#F4C29F"/>
      <rect x="108" y="168" width="34" height="42" fill="#F4C29F"/>
      <ellipse cx="125" cy="116" rx="64" ry="72" fill="#F4C29F"/>
      <path d="M62,100 Q62,38 126,40 Q190,40 188,100 Q170,70 126,72 Q82,72 62,100 Z" fill="#5a4a3a"/>
      <circle cx="102" cy="118" r="18" fill="rgba(255,255,255,.3)"/>
      <circle cx="150" cy="118" r="18" fill="rgba(255,255,255,.3)"/>
      <path d="M120,118 h12" />
      <circle cx="102" cy="118" r="6" fill="#181C24"/>
      <circle cx="150" cy="118" r="6" fill="#181C24"/>
      <path d="M88,92 l24,-4 M138,88 l24,4" stroke-width="5"/>
      <!-- Happy smile -->
      <path d="M90,150 Q126,200 162,150 Q160,186 126,190 Q92,186 90,150 Z" fill="#5a4a3a" opacity=".9"/>
      <path d="M106,154 Q126,174 146,154 Z" fill="#fff"/>
      <ellipse cx="60" cy="120" rx="10" ry="14" fill="#F4C29F"/>
      <ellipse cx="190" cy="120" rx="10" ry="14" fill="#F4C29F"/>
    </g>
  </svg>

  <!-- OFFICIAL USTA VECTOR RIG (CUTTING HAIR WITH SCISSORS & COMB, PHONE IN APRON POCKET) -->
  <div id="usta"></div>

  <!-- BARBER CHAIR + SEATED CUSTOMER -->
  <svg class="cust" style="left:545px;top:1185px;z-index:22" width="450" height="680" viewBox="0 0 450 680">
    <defs>
      <linearGradient id="lea" x1="0" x2="1"><stop offset="0" stop-color="#2a2f3a"/><stop offset=".5" stop-color="#3a414f"/><stop offset="1" stop-color="#1c2028"/></linearGradient>
      <linearGradient id="chr" x1="0" x2="1"><stop offset="0" stop-color="#8d96a3"/><stop offset=".45" stop-color="#f4f7fb"/><stop offset="1" stop-color="#6c7480"/></linearGradient>
    </defs>
    <g stroke="#181C24" stroke-width="5" stroke-linejoin="round">
      <ellipse cx="225" cy="650" rx="150" ry="24" fill="url(#chr)"/>
      <rect x="200" y="540" width="50" height="110" fill="url(#chr)"/>
      <rect x="95" y="70" width="260" height="340" rx="40" fill="url(#lea)"/>
      <rect x="110" y="85" width="230" height="310" rx="30" fill="none" stroke="#FF6B00" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M90,250 Q225,200 360,250 L392,520 Q225,560 58,520 Z" fill="#181C24" stroke="#000"/>
      <path d="M150,260 L130,520 M225,250 V540 M300,260 L320,520" stroke="#2c3240" stroke-width="4"/>
      <path d="M175,232 Q225,256 275,232 L268,262 Q225,280 182,262 Z" fill="#fff"/>
      <rect x="30" y="400" width="90" height="46" rx="20" fill="url(#lea)"/>
      <rect x="330" y="400" width="90" height="46" rx="20" fill="url(#lea)"/>
      <rect x="40" y="446" width="20" height="70" fill="url(#chr)"/>
      <rect x="390" y="446" width="20" height="70" fill="url(#chr)"/>
      <rect x="70" y="510" width="310" height="50" rx="20" fill="url(#lea)"/>
      <path d="M80,515 H370" stroke="#FF6B00" stroke-width="4"/>
      <rect x="150" y="555" width="44" height="60" rx="10" fill="#3b4252"/>
      <rect x="256" y="555" width="44" height="60" rx="10" fill="#3b4252"/>
      <path d="M140,612 h60 v20 h-66 z" fill="#4a2e1c"/>
      <path d="M250,612 h60 v20 h-56 z" fill="#4a2e1c"/>
      <ellipse cx="225" cy="160" rx="66" ry="74" fill="#F4C29F"/>
      <path d="M160,140 Q162,78 226,80 Q290,78 290,142 Q270,108 226,110 Q182,108 160,140 Z" fill="#2d2d2d"/>
      <ellipse cx="160" cy="166" rx="10" ry="15" fill="#F4C29F"/>
      <ellipse cx="290" cy="166" rx="10" ry="15" fill="#F4C29F"/>
      <circle cx="198" cy="152" r="8" fill="#181C24"/>
      <circle cx="252" cy="152" r="8" fill="#181C24"/>
      <path d="M184,132 l26,-4 M240,128 l26,4" stroke-width="5"/>
      <path d="M204,192 Q225,212 246,192" fill="none" stroke-width="5"/>
    </g>
  </svg>

  <div class="vignette"></div>
</div>

<script>
  const clock = document.getElementById("clock");
  for (let i = 0; i < 12; i++) {
    const t = document.createElement("div");
    t.className = "t";
    t.style.transform = `rotate(${i * 30}deg)`;
    clock.appendChild(t);
  }
  const root = document.getElementById("root");
  const mx = 1080 - 60 - 430, my = 250;
  [[0,.25],[0,.45],[0,.65],[0,.85],[1,.25],[1,.45],[1,.65],[1,.85]].forEach(([side, f]) => {
    const b = document.createElement("div");
    b.className = "bulb";
    b.style.left = (side ? mx + 430 - 6 : mx - 20) + "px";
    b.style.top = (my + 640 * f) + "px";
    root.appendChild(b);
  });
  [[120,180,60],[900,140,40],[980,1000,70],[60,1050,50],[760,60,30]].forEach(([x,y,s]) => {
    const b = document.createElement("div");
    b.className = "bokeh";
    Object.assign(b.style, { left: x + "px", top: y + "px", width: s + "px", height: s + "px" });
    root.appendChild(b);
  });

  // Official Usta rig with scissors in right hand, comb in left hand, phone peeking in apron pocket
  const rig = UstaVectorRig.create("#usta", { idPrefix: "usta", showCustomer: false, showChair: false });
  const q = rig.q;
  q("arm-r-upper").setAttribute("transform", "rotate(-32 175 255)");
  q("arm-r-lower").setAttribute("transform", "rotate(-48 155 345)");
  q("arm-l-upper").setAttribute("transform", "rotate(28 325 255)");
  q("arm-l-lower").setAttribute("transform", "rotate(42 345 345)");
  q("scissor-blade-moving").setAttribute("transform", "rotate(28 135 365)");
  q("pocket-phone-peek").setAttribute("opacity", "1");

  const K = KineticCaptions;

  // 1. Organic oval speech bubble from Customer (4 words max, tail stops cleanly above head!)
  K.comicBubble(root, {
    x: 34,
    y: 640,
    w: 465,
    h: 215,
    name: "MÜŞTERİ",
    text: "Randevumu cepten<br><em>hemen aldım!</em>",
    fontSize: 48,
    tailX: 215,
    tailY: 995,
    tilt: -3
  });

  // 2. Jagged starburst shout/joy bubble from Usta (4 words max, tail stops cleanly above Usta's head!)
  K.comicBubble(root, {
    x: 465,
    y: 445,
    w: 565,
    h: 245,
    name: "USTA",
    shout: true,
    text: "Elim makasta,<br><em>randevu cepte!</em>",
    fontSize: 54,
    tailX: 765,
    tailY: 905,
    tilt: 3
  });

  // 3. Tilted die-cut sticker on the arched mirror (100% inside canvas)
  K.sticker(root, {
    x: 595,
    y: 315,
    text: "SIRA BEKLEMEK YOK",
    tilt: 7,
    orange: true,
    fontSize: 34
  });

  // 4. Radial speed-line burst on the right (doesn't cover phone!)
  K.burst(root, {
    x: 985,
    y: 1085,
    size: 145,
    text: "TIK!",
    fontSize: 52
  });
</script>
</body>
</html>
