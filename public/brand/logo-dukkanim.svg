<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 104" width="360" height="104">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="amberDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b45309" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Mark: turuncu zemin -->
  <g filter="url(#soft)">
    <rect x="6" y="14" width="76" height="76" rx="20" fill="url(#amber)"/>
  </g>

  <!-- Sade dükkan: düz tente + gövde -->
  <g transform="translate(6,14)">
    <!-- tente bandı -->
    <rect x="14" y="16" width="48" height="13" rx="3.5" fill="#ffffff"/>
    <!-- tente şeritleri -->
    <rect x="20" y="16" width="8" height="13" fill="url(#amberDeep)"/>
    <rect x="34" y="16" width="8" height="13" fill="url(#amberDeep)"/>
    <rect x="48" y="16" width="8" height="13" fill="url(#amberDeep)"/>
    <!-- tente alt gölge çizgisi -->
    <rect x="14" y="29" width="48" height="3.5" rx="1.75" fill="#1c1917" opacity="0.16"/>
    <!-- gövde -->
    <rect x="20" y="34" width="36" height="24" rx="4" fill="#ffffff"/>
    <!-- vitrin -->
    <rect x="24" y="39" width="13" height="10" rx="2.5" fill="url(#amberDeep)"/>
    <!-- kapı -->
    <rect x="40" y="39" width="12" height="19" rx="2.5" fill="#1c1917"/>
  </g>

  <!-- Wordmark -->
  <text x="98" y="62" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="36" font-weight="800" fill="#1c1917" letter-spacing="-0.5">Dükkânım</text>
  <rect x="99" y="72" width="34" height="3.5" rx="1.75" fill="#f59e0b"/>
  <text x="141" y="76.5" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#78716c" letter-spacing="3.5">KASA • VERESİYE • GÜN SONU</text>
</svg>
