<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Dükkanım Yanımda — Reels Kapak Fotoğrafı (Turuncu & Beyaz Tema)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #181C24;
    font-family: 'Plus Jakarta Sans', "Segoe UI Black", sans-serif;
    color: #181C24;
    -webkit-font-smoothing: antialiased;
  }

  #cover {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 26%, #2f1d13 0%, #1c110a 48%, #0f0905 100%);
  }

  /* BARBERSHOP BACKGROUND ELEMENTS */
  .wood-panel {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, #3d2516 0 72px, #2a180e 72px 76px, #442a19 76px 148px, #2a180e 148px 152px);
    opacity: 0.92;
  }
  .wood-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 36%, rgba(255, 120, 20, 0.32) 0%, transparent 68%),
                linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 18%, transparent 75%, rgba(0,0,0,0.92) 100%);
  }

  /* TILE FLOOR */
  .floor {
    position: absolute;
    left: 0;
    top: 1240px;
    width: 100%;
    height: 680px;
    background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, #1e130c 30%, #120a06 100%),
      repeating-linear-gradient(90deg, transparent 0 132px, rgba(0,0,0,0.3) 132px 136px),
      repeating-linear-gradient(0deg, #2c1c12 0 88px, #1a100a 88px 92px);
    border-top: 6px solid rgba(255, 107, 0, 0.45);
  }

  /* ILLUMINATED MIRROR WITH BULBS */
  .mirror {
    position: absolute;
    right: 30px;
    top: 420px;
    width: 440px;
    height: 800px;
    border-radius: 220px 220px 30px 30px;
    background: linear-gradient(160deg, #445465, #222e39 65%, #162028);
    border: 14px solid #181C24;
    box-shadow: 0 0 0 6px #FF6B00, 0 0 90px rgba(255, 107, 0, 0.45);
    opacity: 0.82;
  }
  .mirror::after {
    content: "";
    position: absolute;
    left: 18%;
    top: 8%;
    width: 20%;
    height: 80%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: skewX(-14deg);
  }
  .mirror-bulb {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #FFF5DC;
    box-shadow: 0 0 24px 8px rgba(255, 215, 130, 0.95);
    border: 2px solid #181C24;
  }

  /* WARM SPOTLIGHTS & BOKEH */
  .spot-top {
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 950px;
    height: 750px;
    background: radial-gradient(circle, rgba(255, 145, 40, 0.35) 0%, rgba(255, 107, 0, 0.12) 45%, transparent 70%);
    pointer-events: none;
  }
  .bokeh {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 190, 110, 0.5), rgba(255, 107, 0, 0.05));
    filter: blur(8px);
    pointer-events: none;
  }

  /* ============================================================ */
  /* TOP HEADER (BRAND PILL) */
  /* ============================================================ */
  .brand-bar {
    position: absolute;
    top: 55px;
    left: 60px;
    right: 60px;
    height: 96px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px);
    border-radius: 48px;
    border: 4px solid #FF6B00;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 40px rgba(255, 107, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 50;
  }
  .brand-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-icon {
    width: 60px;
    height: 60px;
    background: #FF6B00;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(255, 107, 0, 0.45);
  }
  .brand-icon svg {
    width: 38px;
    height: 38px;
    fill: #FFFFFF;
  }
  .brand-title-box {
    display: flex;
    flex-direction: column;
  }
  .brand-title {
    font-size: 32px;
    font-weight: 900;
    color: #181C24;
    letter-spacing: -0.5px;
    line-height: 1.05;
  }
  .brand-title span {
    color: #FF6B00;
  }
  .brand-subtitle {
    font-size: 17px;
    font-weight: 700;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .badge-tag {
    background: #FF6B00;
    color: #FFFFFF;
    font-size: 19px;
    font-weight: 900;
    padding: 10px 24px;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(255, 107, 0, 0.35);
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }

  /* ============================================================ */
  /* MAIN EYE-CATCHING HOOK (Clean, High Up, Never Covers People!) */
  /* ============================================================ */
  .hook-header {
    position: absolute;
    top: 180px;
    left: 50%;
    transform: translateX(-50%);
    width: 980px;
    text-align: center;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .alert-pill {
    background: #FFFFFF;
    color: #181C24;
    font-size: 24px;
    font-weight: 900;
    padding: 10px 32px;
    border-radius: 999px;
    border: 4px solid #181C24;
    box-shadow: 0 8px 0 #181C24, 0 16px 28px rgba(0,0,0,0.35);
    transform: rotate(-2.5deg);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .alert-pill .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #EF4444;
    box-shadow: 0 0 10px #EF4444;
  }

  .main-hook-title {
    font-size: 88px;
    font-weight: 900;
    line-height: 0.95;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: -1.5px;
    text-shadow: 0 8px 24px rgba(0,0,0,0.8), 0 2px 0 #000;
  }

  .hook-highlight-box {
    margin-top: 10px;
    display: inline-block;
    position: relative;
    padding: 10px 44px;
    background: #FF6B00;
    color: #FFFFFF;
    font-size: 96px;
    font-weight: 900;
    line-height: 1;
    border-radius: 26px;
    border: 6px solid #FFFFFF;
    outline: 6px solid #181C24;
    box-shadow: 0 12px 0 #181C24, 0 24px 45px rgba(255, 107, 0, 0.6);
    transform: rotate(2deg);
    text-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }

  .hook-subtext {
    margin-top: 14px;
    font-size: 27px;
    font-weight: 800;
    color: #FFF3EB;
    background: rgba(24, 28, 36, 0.85);
    backdrop-filter: blur(8px);
    padding: 8px 26px;
    border-radius: 18px;
    border: 2px solid rgba(255, 107, 0, 0.5);
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    letter-spacing: 0.2px;
  }

  /* ============================================================ */
  /* CHARACTERS & SCENE (Positioned lower with 100% face clearance!) */
  /* ============================================================ */
  .scene-wrap {
    position: absolute;
    left: 0;
    top: 540px; /* Ample breathing room below the title! */
    width: 1080px;
    height: 960px;
    z-index: 25;
  }

  /* 17:00 WALL CLOCK (Placed clean in the upper background) */
  .clock-wrap {
    position: absolute;
    left: 455px;
    top: 40px;
    width: 165px;
    height: 165px;
    z-index: 22;
  }
  .clock-face {
    width: 155px;
    height: 155px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 9px solid #FF6B00;
    box-shadow: 0 0 0 5px #181C24, 0 14px 32px rgba(0,0,0,0.6);
    position: relative;
  }
  .clock-h {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 9px;
    height: 40px;
    margin-left: -4.5px;
    background: #181C24;
    border-radius: 5px;
    transform-origin: 50% 100%;
    transform: rotate(150deg);
  }
  .clock-m {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 7px;
    height: 58px;
    margin-left: -3.5px;
    background: #181C24;
    border-radius: 4px;
    transform-origin: 50% 100%;
    transform: rotate(0deg);
  }
  .clock-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px;
    border-radius: 50%;
    background: #FF6B00;
    border: 4px solid #181C24;
  }
  .clock-pill-badge {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: #EF4444;
    color: #FFFFFF;
    font-size: 19px;
    font-weight: 900;
    padding: 4px 16px;
    border-radius: 999px;
    border: 3px solid #181C24;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    white-space: nowrap;
  }

  /* SUBTLE COMIC LABELS BESIDE CHARACTERS (NEVER OVER FACES!) */
  .tag-customer-a {
    position: absolute;
    left: 45px;
    top: 80px;
    background: #FFFFFF;
    color: #181C24;
    border: 4px solid #181C24;
    border-radius: 18px;
    padding: 8px 18px;
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 6px 0 #181C24, 0 10px 20px rgba(0,0,0,0.3);
    transform: rotate(-6deg);
    z-index: 38;
    white-space: nowrap;
  }
  .tag-customer-a span { color: #FF6B00; }

  .tag-customer-b {
    position: absolute;
    left: 280px;
    top: 10px;
    background: #FFBA08;
    color: #181C24;
    border: 4px solid #181C24;
    border-radius: 18px;
    padding: 8px 18px;
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 6px 0 #181C24, 0 10px 20px rgba(0,0,0,0.3);
    transform: rotate(5deg);
    z-index: 38;
    white-space: nowrap;
  }
  .tag-customer-b span { color: #E85500; }

  /* SHOCK BURST NEXT TO USTA (NEVER OVER HIS HEAD) */
  .burst-shock {
    position: absolute;
    right: 45px;
    top: 60px;
    width: 140px;
    height: 140px;
    z-index: 35;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CHARACTER DROP SHADOWS */
  .char-shadow {
    position: absolute;
    background: radial-gradient(ellipse, rgba(0,0,0,0.7) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* ============================================================ */
  /* BOTTOM SECTION (SOLUTION BANNER & CALL TO ACTION) */
  /* ============================================================ */
  .bottom-card {
    position: absolute;
    bottom: 50px;
    left: 50px;
    right: 50px;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(20px);
    border-radius: 42px;
    border: 5px solid #FF6B00;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 45px rgba(255, 107, 0, 0.4);
    padding: 26px 36px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .solution-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .solution-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .solution-icon-wrap {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: #FFF3EB;
    border: 3px solid #FF6B00;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .solution-text-title {
    font-size: 26px;
    font-weight: 900;
    color: #181C24;
    line-height: 1.1;
  }
  .solution-text-sub {
    font-size: 18px;
    font-weight: 700;
    color: #64748B;
  }

  .pill-features {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .feat-tag {
    background: #F1F5F9;
    color: #334155;
    font-size: 17px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 12px;
    border: 2px solid #E2E8F0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .feat-tag.active {
    background: #FFF3EB;
    color: #E85500;
    border-color: #FF6B00;
  }

  /* BIG INTERACTIVE CTA BUTTON */
  .cta-btn {
    width: 100%;
    height: 82px;
    background: linear-gradient(135deg, #FF7A00 0%, #FF5500 100%);
    border-radius: 26px;
    border: 4px solid #FFFFFF;
    outline: 4px solid #181C24;
    box-shadow: 0 8px 0 #181C24, 0 16px 30px rgba(255, 107, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #FFFFFF;
    font-size: 34px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.25);
  }
  .cta-btn .chat-icon {
    width: 38px;
    height: 38px;
    fill: #FFFFFF;
  }

  /* AMBIENT VIGNETTE */
  .vignette-ambient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(10, 6, 4, 0.75) 100%);
    pointer-events: none;
    z-index: 45;
  }
</style>
</head>

<div id="cover">
  <!-- Barbershop Interior Background -->
  <div class="wood-panel"></div>
  <div class="floor"></div>

  <!-- Mirror Bulbs -->
  <div class="mirror-bulb" style="right: 452px; top: 580px;"></div>

  <!-- ============================================================ -->
  <!-- MAIN EYE-CATCHING HOOK (Crisp, High Up, Clean!) -->
  <!-- ============================================================ -->
  <div class="hook-header">
    <div class="alert-pill">
      <span class="dot"></span>

        <div class="clock-h"></div>
        <div class="clock-m"></div>

    <!-- Shock Burst next to Usta -->

    <!-- Customer A (Young man, grey hoodie, pointing to himself - Head fully visible!) -->

    </svg>

    <!-- Customer B (Navy jacket, glasses, raising smartphone showing 17:00 - Head fully visible!) -->

        <circle cx="46" cy="408" r="17" fill="#F4C29F"/>
        <!-- Raised arm holding phone with 17:00 -->

        <g transform="translate(186,18) rotate(10)">
